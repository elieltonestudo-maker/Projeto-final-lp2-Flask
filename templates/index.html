<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Cédulas - Flask</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --gold-accent: #f1c40f;
            --border-color: #333333;
            --input-bg: #2d2d2d;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .header { text-align: center; padding: 20px; color: var(--gold-accent); font-size: 24px; font-weight: bold; }
        .tabs-container { display: flex; background-color: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 0 20px; }
        .tab { padding: 15px 30px; cursor: pointer; font-size: 14px; font-weight: bold; color: #888; border-bottom: 3px solid transparent; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; }
        .tab:hover { color: var(--text-color); }
        .tab.active { color: var(--gold-accent); border-bottom: 3px solid var(--gold-accent); background-color: rgba(241, 196, 15, 0.05); }
        .tab-content { display: none; padding: 20px; max-width: 1400px; margin: 0 auto; } /* Aumentei a largura máxima */
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .panel-title { color: var(--gold-accent); margin-top: 0; margin-bottom: 15px; font-size: 16px; display: flex; align-items: center; gap: 10px; }
        .input-group { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        input[type="text"], input[type="number"], select { background-color: var(--input-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 10px; border-radius: 5px; outline: none; }
        input:focus, select:focus { border-color: var(--gold-accent); }
        .btn { background-color: var(--gold-accent); color: #000; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn:hover { opacity: 0.8; }
        .btn-outline { background-color: transparent; border: 1px solid var(--gold-accent); color: var(--gold-accent); }
        
        /* TABELA MAIS ESPAÇADA */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border-bottom: 1px solid var(--border-color); padding: 15px 10px; text-align: left; font-size: 13px; white-space: nowrap; }
        th { color: var(--gold-accent); text-transform: uppercase; }
        
        /* Estilo para o campo de moeda */
        .money-input-container { display: flex; align-items: center; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 5px; padding-left: 8px; }
        .money-input-container:focus-within { border-color: var(--gold-accent); }
        .money-symbol { color: #888; font-weight: bold; font-size: 12px; }
        .money-input-container input { border: none !important; background: transparent !important; padding-left: 5px; width: 70px; }

        .search-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 15px; }
        .filter-item { display: flex; flex-direction: column; gap: 5px; }
        .filter-item label { font-size: 12px; color: #aaa; }
        .chart-area { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; }
        .fake-bar { height: 30px; background-color: var(--gold-accent); margin-bottom: 15px; border-radius: 3px; display: flex; align-items: center; padding-left: 10px; color: #000; font-weight: bold; font-size: 12px; }
        
        /* ESTILO PARA DATA INVÁLIDA */
        .data-invalida { border: 1px solid #ff4d4d !important; color: #ff4d4d !important; }
    </style>
</head>
<body>

    <div class="header">Aquisições</div>

    <div class="tabs-container">
        <div class="tab active" onclick="switchTab('registrar')">📄 REGISTRAR</div>
        <div class="tab" onclick="switchTab('pesquisar')">🔍 PESQUISAR</div>
    </div>

    <div id="tab-registrar" class="tab-content active">
        
        <div class="panel">
            <h3 class="panel-title">ℹ️ INFORMAÇÕES DO LOTE</h3>
            <div class="input-group">
                <label>Tipo:</label>
                <select id="tipo-lote" onchange="atualizarTaxaGlobal()">
                    <option>Leilão Oficial</option>
                    <option>Venda Direta</option>
                </select>
                
                <label>Vendedor:</label>
                <input type="text" id="vendedor-lote" placeholder="Buscar vendedor..." style="width: 200px;">
                
                <label>Frete:</label>
                <input type="number" id="frete-lote" placeholder="0.00" style="width: 100px;" oninput="recalcularTabela()">
                
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" id="check-extras"> Custos Extras?
                </label>
                <input type="number" id="input-extras" placeholder="0.00" style="width: 100px; display: none;" oninput="recalcularTabela()">
            </div>
        </div>

        <div class="panel">
            <h3 class="panel-title">📋 CÉDULAS DO LOTE</h3>
            
            <div class="input-group" style="justify-content: space-between; margin-bottom: 15px; padding: 10px; background: #2a2a2a; border-radius: 5px;">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <label style="color: var(--gold-accent); font-weight: bold;">Ações em Massa:</label>
                    <input type="text" id="massa-data" placeholder="DD/MM/AAAA" style="width: 120px;" oninput="aplicarMascaraData(this)">
                    <input type="text" id="massa-ref" placeholder="Nº Leilão/Lote" style="width: 120px;">
                    <button class="btn btn-outline" onclick="aplicarEmMassa()">Aplicar aos Selecionados</button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn">📥 Importar Texto</button>
                    <form id="form-pdf" action="/processar_pdf" method="POST" enctype="multipart/form-data" style="display: inline;" onsubmit="event.preventDefault(); processarArquivo(this);">
                        <input type="file" name="arquivo_pdf" id="input-pdf" accept=".pdf" style="display: none;" onchange="document.getElementById('form-pdf').requestSubmit();">
                        <button type="button" class="btn" onclick="document.getElementById('input-pdf').click();">📥 Importar PDF</button>
                    </form>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="check-todos" onclick="selecionarTodos(this)"></th>
                        <th>Nº</th>
                        <th>Data</th>
                        <th>Ref. / Lote</th>
                        <th>País</th>
                        <th>Valor</th>
                        <th>Ano</th> <!-- NOVA COLUNA -->
                        <th>Estado</th>
                        <th>Martelo</th>
                        <th>Taxa (%)</th>
                        <th>Subtotal</th>
                        <th>Rateio</th>
                        <th>Custo Final</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela">
                </tbody>
            </table>
        </div>
        
        <button class="btn" style="width: 100%; padding: 15px; font-size: 16px;" onclick="salvarLote()">💾 SALVAR LOTE COMPLETO</button>
    </div>

    <div id="tab-pesquisar" class="tab-content">
        <div class="panel">
            <div class="input-group" style="margin-bottom: 20px;">
                <label>Buscar:</label>
                <input type="text" placeholder="Filtre instantaneamente por nome, país ou vendedor..." style="width: 100%;">
            </div>
            <h3 class="panel-title" style="font-size: 14px;">▼ Filtros Avançados</h3>
            <div class="filter-grid">
                <div class="filter-item"><label>Vendedor:</label><select><option>Todos</option></select></div>
                <div class="filter-item"><label>País:</label><select><option>Todos</option></select></div>
                <div class="filter-item"><label>Conservação:</label><select><option>Todas</option></select></div>
                <div class="filter-item"><label>Data Início:</label><input type="text"></div>
                <div class="filter-item"><label>Valor Mín:</label><input type="number"></div>
                <div class="filter-item"><label>Ordenar por:</label><select><option>Nome</option></select></div>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button class="btn btn-outline">Limpar</button>
                <button class="btn">🔍 Aplicar Filtros</button>
                <button class="btn btn-outline">📄 Relatório</button>
            </div>
        </div>
    </div>

    <script>
        function aplicarMascaraData(input) {
            let valor = input.value.replace(/\D/g, ''); 
            if (valor.length > 8) valor = valor.slice(0, 8); 

            if (valor.length === 0) {
                input.value = "";
                input.classList.remove('data-invalida');
                return;
            }

            if (valor.length >= 5) {
                valor = valor.replace(/^(\d{2})(\d{2})(\d{1,4}).*/, '$1/$2/$3');
            } else if (valor.length >= 3) {
                valor = valor.replace(/^(\d{2})(\d{1,2}).*/, '$1/$2');
            }

            input.value = valor;

            // Validação e Padronização no Blur (quando sai do campo)
            input.onblur = function() {
                let valorAtual = input.value.replace(/\D/g, '');
                if (valorAtual.length === 8) {
                    let dia = valorAtual.substring(0, 2);
                    let mes = valorAtual.substring(2, 4);
                    let ano = valorAtual.substring(4, 8);
                    
                    if (ano.length === 2) ano = "20" + ano; // Transforma 24 em 2024
                    
                    let dataFormatada = `${dia}/${mes}/${ano}`;
                    input.value = dataFormatada;

                    const partes = dataFormatada.split('/');
                    let d = parseInt(partes[0]);
                    let m = parseInt(partes[1]) - 1; 
                    let a = parseInt(partes[2]);

                    const dataDigitada = new Date(a, m, d);
                    const hoje = new Date();
                    hoje.setHours(0, 0, 0, 0); 

                    if (dataDigitada > hoje || isNaN(dataDigitada.getTime())) {
                        input.classList.add('data-invalida');
                        input.title = "Data no futuro ou inválida!";
                    } else {
                        input.classList.remove('data-invalida');
                        input.title = "";
                    }
                } else if (valorAtual.length > 0) {
                    input.classList.add('data-invalida');
                }
            };
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'registrar') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('tab-registrar').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('tab-pesquisar').classList.add('active');
            }
        }

        document.getElementById('check-extras').addEventListener('change', function() {
            const inputExtras = document.getElementById('input-extras');
            inputExtras.style.display = this.checked ? 'block' : 'none';
            if(!this.checked) { inputExtras.value = ''; recalcularTabela(); }
        });

        async function processarArquivo(form) {
            const botao = form.querySelector('button');
            const textoOriginal = botao.innerHTML;
            botao.innerHTML = '⏳ Processando...';

            const formData = new FormData(form);

            try {
                const response = await fetch('/processar_pdf', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.cedulas && data.cedulas.length > 0) {
                    renderizarTabela(data.cedulas);
                } else {
                    alert('Nenhuma cédula encontrada no PDF.');
                }
            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao ler o PDF.');
            } finally {
                botao.innerHTML = textoOriginal;
                form.reset();
            }
        }

        function atualizarTaxaGlobal() {
            const tipo = document.getElementById('tipo-lote').value;
            const taxa = (tipo === 'Leilão Oficial') ? 5 : 0; 
            
            const inputsTaxa = document.querySelectorAll('.input-taxa');
            inputsTaxa.forEach(input => {
                input.value = taxa;
                input.style.color = "var(--text-color)"; 
            });
            
            const checkboxesIsento = document.querySelectorAll('.check-isento');
            checkboxesIsento.forEach(cb => cb.checked = false);
            
            recalcularTabela();
        }

        function renderizarTabela(cedulas) {
            const tbody = document.getElementById('corpo-tabela');
            tbody.innerHTML = '';
            
            const tipo = document.getElementById('tipo-lote').value;
            const taxaPadrao = (tipo === 'Leilão Oficial') ? 5 : 0;

            cedulas.forEach((cedula, index) => {
                const paisCorrigido = cedula.pais.replace('\\u00e3', 'ã').replace('\\u00e9', 'é').replace('\\u00ed', 'í');
                let descricaoCorrigida = cedula.descricao.replace('\\u00e3', 'ã');
                
                // SEPARA O ANO DO VALOR
                let valorFacial = descricaoCorrigida;
                let ano = "";
                
                // Expressão regular para encontrar um ano (4 dígitos, ex: 1990) no final ou no meio da descrição
                const matchAno = descricaoCorrigida.match(/\b(19|20)\d{2}\b/);
                if (matchAno) {
                    ano = matchAno[0];
                    // Remove o ano da descrição do valor
                    valorFacial = descricaoCorrigida.replace(ano, '').trim();
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="checkbox" class="check-selecao"></td>
                    <td>${index + 1}</td>
                    <td><input type="text" class="input-data" placeholder="DD/MM/AAAA" style="width: 110px;" oninput="aplicarMascaraData(this)"></td>
                    <td><input type="text" class="input-ref" placeholder="Lote/Ref" style="width: 80px;"></td>
                    <td>${paisCorrigido}</td>
                    <td>${valorFacial}</td> <!-- VALOR SEM O ANO -->
                    <td>${ano}</td> <!-- ANO SEPARADO -->
                    <td>FE</td>
                    <td>
                        <div class="money-input-container">
                            <span class="money-symbol">R$</span>
                            <input type="number" class="input-martelo" value="${cedula.valor.toFixed(2)}" oninput="recalcularTabela()">
                        </div>
                    </td>
                    <td style="display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" class="check-isento" onchange="alternarIsencao(this)" title="Isentar taxa (Compra por fora)">
                        <input type="number" class="input-taxa" value="${taxaPadrao}" style="width: 50px;" oninput="recalcularTabela()">
                    </td>
                    <td class="td-subtotal">R$ 0,00</td>
                    <td class="td-rateio">R$ 0,00</td>
                    <td class="td-custo-final">R$ 0,00</td>
                `;
                tbody.appendChild(tr);
            });
            recalcularTabela(); 
        }

        function selecionarTodos(checkTodos) {
            const checkboxes = document.querySelectorAll('.check-selecao');
            checkboxes.forEach(cb => cb.checked = checkTodos.checked);
        }

        function aplicarEmMassa() {
            let novaDataInput = document.getElementById('massa-data');
            let novaData = novaDataInput.value;
            const novaRef = document.getElementById('massa-ref').value;

            // 1. Força a formatação da data em massa antes de aplicar
            if (novaData.length > 0) {
                let apenasNumeros = novaData.replace(/\D/g, '');
                if (apenasNumeros.length === 8) {
                    let d = apenasNumeros.substring(0, 2);
                    let m = apenasNumeros.substring(2, 4);
                    let a = apenasNumeros.substring(4, 8);
                    if (a.length === 2) a = "20" + a;
                    novaData = `${d}/${m}/${a}`;
                    novaDataInput.value = novaData;
                } else if (apenasNumeros.length === 6) { // Ex: 151024
                    let d = apenasNumeros.substring(0, 2);
                    let m = apenasNumeros.substring(2, 4);
                    let a = "20" + apenasNumeros.substring(4, 6);
                    novaData = `${d}/${m}/${a}`;
                    novaDataInput.value = novaData;
                } else {
                    alert("⚠️ Data em massa incompleta. Use o formato DD/MM/AAAA.");
                    return;
                }
            }

            // 2. Valida se a data é no futuro
            if (novaData.length === 10) {
                const partes = novaData.split('/');
                const dataDigitada = new Date(partes[2], partes[1] - 1, partes[0]);
                const hoje = new Date();
                hoje.setHours(0, 0, 0, 0);
                
                if (dataDigitada > hoje || isNaN(dataDigitada.getTime())) {
                    novaDataInput.classList.add('data-invalida');
                    alert("❌ A data em massa (" + novaData + ") é no futuro ou inválida. Corrija antes de aplicar.");
                    return; // Bloqueia o resto da função
                } else {
                    novaDataInput.classList.remove('data-invalida');
                }
            }

            // 3. Aplica nas linhas selecionadas
            const linhasSelecionadas = document.querySelectorAll('.check-selecao:checked');
            
            if (linhasSelecionadas.length === 0) {
                alert("Selecione pelo menos uma cédula na tabela para aplicar.");
                return;
            }

            linhasSelecionadas.forEach(checkbox => {
                const linha = checkbox.closest('tr');
                if (novaData) {
                    const inputData = linha.querySelector('.input-data');
                    inputData.value = novaData;
                    // Chama a validação para garantir que a linha não fique vermelha se estiver tudo certo
                    aplicarMascaraData(inputData);
                }
                if (novaRef) linha.querySelector('.input-ref').value = novaRef;
            });
            
            recalcularTabela();
        }

        function alternarIsencao(checkbox) {
            const linha = checkbox.closest('tr');
            const inputTaxa = linha.querySelector('.input-taxa');
            
            if (checkbox.checked) {
                inputTaxa.value = 0;
                inputTaxa.style.color = "#ff4d4d"; 
            } else {
                const tipo = document.getElementById('tipo-lote').value;
                inputTaxa.value = (tipo === 'Leilão Oficial') ? 5 : 0;
                inputTaxa.style.color = "var(--text-color)";
            }
            recalcularTabela();
        }

        function recalcularTabela() {
            const frete = parseFloat(document.getElementById('frete-lote').value) || 0;
            const checkExtras = document.getElementById('check-extras').checked;
            const custosExtras = checkExtras ? (parseFloat(document.getElementById('input-extras').value) || 0) : 0;
            
            const valorTotalFrete = frete + custosExtras;

            let somaMartelos = 0;
            const linhas = document.querySelectorAll('#corpo-tabela tr');
            
            linhas.forEach(linha => {
                const inputMartelo = linha.querySelector('.input-martelo');
                if (inputMartelo) {
                    somaMartelos += parseFloat(inputMartelo.value) || 0;
                }
            });

            linhas.forEach(linha => {
                const inputMartelo = linha.querySelector('.input-martelo');
                const inputTaxa = linha.querySelector('.input-taxa');
                
                if (!inputMartelo) return;

                const martelo = parseFloat(inputMartelo.value) || 0;
                const taxa = parseFloat(inputTaxa.value) || 0;
                
                const subtotal = martelo + (martelo * (taxa / 100));
                
                let rateio = 0;
                if (somaMartelos > 0) {
                    rateio = (martelo / somaMartelos) * valorTotalFrete;
                }

                const custoFinal = subtotal + rateio;

                // Ajuste para não quebrar linha e manter o R$ na mesma linha
                linha.querySelector('.td-subtotal').innerText = `R$ ${subtotal.toFixed(2).replace('.', ',')}`;
                linha.querySelector('.td-rateio').innerText = `R$ ${rateio.toFixed(2).replace('.', ',')}`;
                linha.querySelector('.td-custo-final').innerText = `R$ ${custoFinal.toFixed(2).replace('.', ',')}`;
            });
        }

        async function salvarLote() {
            // 1. VERIFICA SE EXISTE ALGUMA DATA INVÁLIDA OU EM BRANCO
            const camposData = document.querySelectorAll('.input-data');
            let temDataInvalida = false;
            
            camposData.forEach(input => {
                if (input.classList.contains('data-invalida') || input.value.trim() === '') {
                    temDataInvalida = true;
                    input.classList.add('data-invalida'); // Deixa vermelho para o usuário ver
                }
            });

            if (temDataInvalida) {
                alert("❌ Erro: Existem datas inválidas, no futuro ou em branco. Corrija os campos em vermelho antes de salvar.");
                return; // Para a execução aqui e não envia para o Python
            }

            // 2. PEGA OS DADOS GERAIS DO LOTE
            const vendedor = document.getElementById('vendedor-lote').value;
            const tipo = document.getElementById('tipo-lote').value;
            const frete = parseFloat(document.getElementById('frete-lote').value) || 0;
            const checkExtras = document.getElementById('check-extras').checked;
            const custosExtras = checkExtras ? parseFloat(document.getElementById('input-extras').value) || 0 : 0;

            // 3. PEGA OS DADOS DAS CÉDULAS NA TABELA
            const linhas = document.querySelectorAll('#corpo-tabela tr');
            const cedulas = [];

            linhas.forEach(linha => {
                const colunas = linha.querySelectorAll('td');
                const inputMartelo = linha.querySelector('.input-martelo');
                const inputTaxa = linha.querySelector('.input-taxa');
                const inputData = linha.querySelector('.input-data');
                const inputRef = linha.querySelector('.input-ref');
                
                if (inputMartelo) {
                    cedulas.push({
                        pais: colunas[4].innerText,
                        descricao: `${colunas[5].innerText} ${colunas[6].innerText}`.trim(), // Junta Valor e Ano
                        data: inputData.value,
                        ref_lote: inputRef.value,
                        codigo: "", 
                        martelo: parseFloat(inputMartelo.value) || 0,
                        taxa_linha: parseFloat(inputTaxa.value) || 0 
                    });
                }
            });

            // 4. VERIFICA SE TEM CÉDULAS NA TABELA
            if (cedulas.length === 0) {
                alert("Adicione cédulas antes de salvar!");
                return;
            }

            // 5. MONTA O PACOTE DE DADOS
            const dadosParaSalvar = {
                vendedor: vendedor || "Vendedor sem nome",
                tipo: tipo,
                frete: frete,
                custos_extras: custosExtras,
                cedulas: cedulas
            };

            // 6. ENVIA PARA O FLASK (PYTHON)
            try {
                const response = await fetch('/salvar_lote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosParaSalvar)
                });

                const data = await response.json();

                if (response.ok) {
                    alert("✅ " + data.mensagem);
                    document.getElementById('corpo-tabela').innerHTML = ''; // Limpa a tabela após salvar
                } else {
                    alert("❌ Erro no servidor: " + data.erro);
                }
            } catch (error) {
                console.error('Erro ao salvar:', error);
                alert("Erro de comunicação com o servidor.");
            }
        }
    </script>
</body>
</html>
