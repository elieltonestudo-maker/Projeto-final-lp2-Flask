<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema de Cédulas</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --panel-bg: #1e1e1e; 
            --text-color: #e0e0e0; 
            --gold-accent: #f1c40f; 
            --border-color: #333; 
            --input-bg: #2d2d2d;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-color); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: 0; 
        }
        .login-box {
            background: var(--panel-bg); 
            padding: 40px; 
            border-radius: 8px;
            border: 1px solid var(--gold-accent); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%; 
            max-width: 400px; 
            text-align: center;
        }
        h1 { 
            color: var(--gold-accent); 
            margin-top: 0; 
            font-size: 24px; 
            margin-bottom: 20px; 
        }
        input {
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            background: var(--input-bg);
            border: 1px solid var(--border-color); 
            color: white; 
            border-radius: 5px;
            font-size: 16px; 
            outline: none; 
            box-sizing: border-box;
            transition: border 0.2s;
        }
        input:focus { 
            border-color: var(--gold-accent); 
        }
        button {
            width: 100%; 
            padding: 12px; 
            background: var(--gold-accent); 
            color: #000;
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 16px;
            cursor: pointer; 
            transition: 0.3s;
        }
        button:hover { 
            transform: scale(1.02); 
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5); 
        }
        .erro { 
            background: rgba(255, 77, 77, 0.2); 
            color: #ff4d4d; 
            border: 1px solid #ff4d4d; 
            padding: 10px; 
            border-radius: 5px; 
            margin-bottom: 20px; 
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🪙 Sistema de Cédulas</h1>
        
        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="password" name="senha" placeholder="Digite a senha de acesso" required autofocus>
            <button type="submit">Entrar no Sistema</button>
        </form>
    </div>
</body>
</html>
