<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Central de Aquisições</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --panel-bg: #1e1e1e; 
            --text-color: #e0e0e0; 
            --gold-accent: #f1c40f; 
            --border-color: #333; 
            --input-bg: #2d2d2d;
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-color); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: 0; 
        }
        .login-box {
            background: var(--panel-bg); 
            padding: 40px; 
            border-radius: 8px;
            border: 1px solid var(--gold-accent); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%; 
            max-width: 400px; 
            text-align: center;
        }
        
        .login-logo {
            width: 180px;      /* Aumente a largura (tente 180px, 200px ou 220px) */
            height: auto;      /* Mude de 90px para auto! Isso mantém a proporção perfeita */
            object-fit: contain;
            margin-bottom: 25px;
            /*filter: drop-shadow(0 0 10px rgba(241, 196, 15, 0.3)); /* essa linha dá um brilho atrás da imagem do logo
            /* O SEGREDO ESTÁ AQUI: */
            mix-blend-mode: screen; 
        }

        h1 { 
            color: var(--gold-accent); 
            margin-top: 0; 
            font-size: 24px; 
            margin-bottom: 8px; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .subtitulo {
            font-size: 13px;
            color: #888;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%; 
            padding: 12px; 
            margin-bottom: 20px; 
            background: var(--input-bg);
            border: 1px solid var(--border-color); 
            color: white; 
            border-radius: 5px;
            font-size: 16px; 
            outline: none; 
            box-sizing: border-box;
            transition: border 0.2s;
        }
        input:focus { 
            border-color: var(--gold-accent); 
        }
        button {
            width: 100%; 
            padding: 12px; 
            background: var(--gold-accent); 
            color: #000;
            border: none; 
            border-radius: 5px; 
            font-weight: bold; 
            font-size: 16px;
            cursor: pointer; 
            transition: 0.3s;
        }
        button:hover { 
            transform: scale(1.02); 
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5); 
        }
        .erro { 
            background: rgba(255, 77, 77, 0.2); 
            color: #ff4d4d; 
            border: 1px solid #ff4d4d; 
            padding: 10px; 
            border-radius: 5px; 
            margin-bottom: 20px; 
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <!-- 👇 COLOQUE O CAMINHO DA SUA IMAGEM AQUI 👇 -->
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" class="login-logo">
        
        <h1>Gestão Numismática</h1>
        <p class="subtitulo">Controle de Cédulas e Acervo</p>
        
        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <!-- NOVO: Campo de usuário -->
            <input type="text" name="username" placeholder="Nome de usuário" required autofocus>
            
            <input type="password" name="senha" placeholder="Digite a senha de acesso" required>
            
            <button type="submit">Entrar no Sistema</button>
        </form>
        
        <!-- NOVO: Link para tela de cadastro -->
        <div style="margin-top: 20px; font-size: 13px;">
            <span style="color: #aaa;">Não tem uma conta?</span> 
            <a href="/cadastro" style="color: var(--gold-accent); text-decoration: none; font-weight: bold;">Cadastre-se</a>
        </div>
    </div>
</body>
</html>
